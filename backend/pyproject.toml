[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "knowledge-service"
version = "0.1.0"
description = "Multi-domain knowledge ingestion and evidence-based RAG"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.7,<3",
  "pymongo>=4.13,<5", "pymilvus>=2.6,<2.7", "neo4j>=5.26,<7",
  "minio>=7.2,<8", "httpx>=0.28,<1", "langgraph>=1,<2",
  "langgraph-checkpoint-mongodb>=0.2,<1", "python-multipart>=0.0.20,<1",
  "argon2-cffi>=23.1,<26", "prometheus-client>=0.21,<1", "pyyaml>=6,<7",
  "python-dotenv>=1.1,<2",
]

[project.scripts]
knowledge-service = "knowledge_service.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.11,<1", "mongomock>=4.3,<5"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["integration: requires explicitly configured real services"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
