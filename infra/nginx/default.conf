server {
    listen 8080;
    server_tokens off;
    client_max_body_size 21m;
    location /import/ {
        proxy_pass http://kb-import:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /query/ {
        proxy_pass http://kb-query:8001/;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 260s;
    }
    location / {
        proxy_pass http://kb-query:8001;
        proxy_set_header Host $host;
    }
}
