server {
    listen 127.0.0.1:18080;
    server_tokens off;
    client_max_body_size 21m;
    location /import/ {
        proxy_pass http://127.0.0.1:18000/;
        proxy_set_header Host $host;
    }
    location /query/ {
        proxy_pass http://127.0.0.1:18001/;
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_read_timeout 260s;
    }
    location / {
        proxy_pass http://127.0.0.1:18001;
        proxy_set_header Host $host;
    }
}
