name: knowledge-cpu
x-backend: &backend
  build:
    context: ..
    dockerfile: infra/docker/Dockerfile.backend
  image: knowledge-backend:0.1.0
  restart: unless-stopped
  init: true
  read_only: true
  tmpfs: [/tmp]
  mem_limit: 2g
  cpus: 2
  security_opt: [no-new-privileges:true]
  networks: [knowledge]
x-business: &business
  APP_ENV: ${APP_ENV:-dev}
  MONGODB_DATABASE: knowledge_${APP_ENV:-dev}
  GRAPH_CHECKPOINT_DATABASE: knowledge_checkpoints_${APP_ENV:-dev}
  MINIO_ENDPOINT: minio:9000
  MINIO_ACCESS_KEY: ${MINIO_APP_USER:-kb-business}
  MINIO_SECRET_KEY: ${MINIO_APP_PASSWORD:?required}
  MILVUS_URI: http://milvus:19530
  NEO4J_URI: bolt://neo4j:7687
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: ${NEO4J_PASSWORD:?required}
  BGE_M3_SERVICE_URL: ${BGE_M3_SERVICE_URL:-}
  BGE_MODEL_REVISION: ${BGE_MODEL_REVISION:-}
  BGE_SERVICE_TOKEN: ${BGE_SERVICE_TOKEN:?required}
  RERANKER_SERVICE_URL: ${RERANKER_SERVICE_URL:-}
  RERANKER_SERVICE_TOKEN: ${RERANKER_SERVICE_TOKEN:?required}
  RERANKER_MODEL_REVISION: ${RERANKER_MODEL_REVISION:-}
  ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-["http://localhost:8080","http://localhost:8001","http://localhost:8000"]}
  TRUSTED_HOSTS: ${TRUSTED_HOSTS:-["localhost","127.0.0.1"]}
  COOKIE_SECURE: ${COOKIE_SECURE:-false}
services:
  mongodb:
    image: mongo:8.0.4
    restart: unless-stopped
    entrypoint: [/bin/sh, /bootstrap/mongo-entrypoint.sh]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-kb-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?required}
    secrets: [mongo_key]
    volumes: ["mongo-data:/data/db", "./scripts/mongo-entrypoint.sh:/bootstrap/mongo-entrypoint.sh:ro"]
    healthcheck:
      test: [CMD, mongosh, --quiet, --eval, "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 2g
    cpus: 2
    networks: [knowledge]
  minio:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.minio
    image: knowledge-minio:RELEASE.2025-10-15T17-29-55Z
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-kb-storage-root}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?required}
    volumes: ["minio-data:/data"]
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:9000/minio/health/live]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 2g
    cpus: 2
    networks: [knowledge]
  minio-init:
    build:
      context: ..
      dockerfile: infra/docker/Dockerfile.mc
    image: knowledge-mc:RELEASE.2025-08-13T08-35-41Z
    restart: "no"
    command: [/bootstrap/minio-init.sh]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-kb-storage-root}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?required}
      MINIO_APP_USER: ${MINIO_APP_USER:-kb-business}
      MINIO_APP_PASSWORD: ${MINIO_APP_PASSWORD:?required}
      MINIO_QUERY_USER: ${MINIO_QUERY_USER:-kb-query}
      MINIO_QUERY_PASSWORD: ${MINIO_QUERY_PASSWORD:?required}
      MINIO_MILVUS_USER: ${MINIO_MILVUS_USER:-milvus-storage}
      MINIO_MILVUS_PASSWORD: ${MINIO_MILVUS_PASSWORD:?required}
    volumes: ["./scripts/minio-init.sh:/bootstrap/minio-init.sh:ro"]
    depends_on:
      minio: {condition: service_healthy}
    networks: [knowledge]
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    restart: unless-stopped
    command: [etcd, -advertise-client-urls=http://etcd:2379, -listen-client-urls=http://0.0.0.0:2379, --data-dir=/etcd]
    environment: {ETCD_AUTO_COMPACTION_MODE: revision, ETCD_AUTO_COMPACTION_RETENTION: "1000", ETCD_QUOTA_BACKEND_BYTES: "4294967296"}
    volumes: ["etcd-data:/etcd"]
    healthcheck:
      test: [CMD, etcdctl, endpoint, health]
      interval: 10s
      timeout: 5s
      retries: 12
    mem_limit: 1g
    cpus: 1
    networks: [knowledge]
  milvus:
    image: milvusdb/milvus:v2.6.4
    restart: unless-stopped
    command: [milvus, run, standalone]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${MINIO_MILVUS_USER:-milvus-storage}
      MINIO_SECRET_ACCESS_KEY: ${MINIO_MILVUS_PASSWORD:?required}
      MINIO_BUCKET_NAME: milvus-internal
      MINIO_REGION: us-east-1
    volumes: ["milvus-data:/var/lib/milvus", "./milvus/user.yaml:/milvus/configs/user.yaml:ro"]
    depends_on:
      etcd: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    healthcheck:
      test: [CMD, curl, -fsS, http://localhost:9091/healthz]
      interval: 15s
      timeout: 5s
      retries: 12
    mem_limit: 6g
    cpus: 4
    networks: [knowledge]
  neo4j:
    image: neo4j:5.26.0-community
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?required}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
      NEO4J_server_memory_pagecache_size: 512m
    volumes: ["neo4j-data:/data", "neo4j-logs:/logs"]
    healthcheck:
      test: [CMD-SHELL, "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#*/}\" 'RETURN 1' >/dev/null 2>&1"]
      interval: 15s
      timeout: 5s
      retries: 12
    mem_limit: 2g
    cpus: 2
    networks: [knowledge]
  kb-import:
    <<: *backend
    command: [uvicorn, knowledge_service.import_app:app, --host, 0.0.0.0, --port, "8000"]
    ports: ["127.0.0.1:8000:8000"]
    environment:
      <<: *business
      MONGODB_URI: mongodb://kb_import:${MONGO_IMPORT_PASSWORD:?required}@mongodb:27017/knowledge_${APP_ENV:-dev}?authSource=knowledge_${APP_ENV:-dev}&replicaSet=rs0
      MILVUS_TOKEN: kb_import:${MILVUS_IMPORT_PASSWORD:?required}
    depends_on: [mongodb, minio, milvus, neo4j]
  kb-query:
    <<: *backend
    ports: ["127.0.0.1:8001:8001"]
    environment:
      <<: *business
      MONGODB_URI: mongodb://kb_query:${MONGO_QUERY_PASSWORD:?required}@mongodb:27017/knowledge_${APP_ENV:-dev}?authSource=knowledge_${APP_ENV:-dev}&replicaSet=rs0
      MILVUS_TOKEN: kb_query:${MILVUS_QUERY_PASSWORD:?required}
      MINIO_ACCESS_KEY: ${MINIO_QUERY_USER:-kb-query}
      MINIO_SECRET_KEY: ${MINIO_QUERY_PASSWORD:?required}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: qwen-flash
    depends_on: [mongodb, minio, milvus, neo4j]
  kb-worker:
    <<: *backend
    command: [knowledge-service, worker]
    environment:
      <<: *business
      MONGODB_URI: mongodb://kb_worker:${MONGO_WORKER_PASSWORD:?required}@mongodb:27017/knowledge_${APP_ENV:-dev}?authSource=knowledge_${APP_ENV:-dev}&replicaSet=rs0
      MILVUS_TOKEN: kb_worker:${MILVUS_WORKER_PASSWORD:?required}
      MINERU_API_TOKEN: ${MINERU_API_TOKEN:-}
      MINERU_TRANSFER_HOSTS: ${MINERU_TRANSFER_HOSTS:-[]}
    depends_on: [mongodb, minio, milvus, neo4j]
  kb-admin:
    <<: *backend
    profiles: [tools]
    restart: "no"
    read_only: false
    entrypoint: [knowledge-service]
    command: [doctor]
    environment:
      <<: *business
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-kb-root}:${MONGO_ROOT_PASSWORD:?required}@mongodb:27017/?authSource=admin&replicaSet=rs0
      MILVUS_TOKEN: root:${MILVUS_ROOT_PASSWORD:?required}
      MILVUS_ROOT_PASSWORD: ${MILVUS_ROOT_PASSWORD:?required}
      MILVUS_IMPORT_PASSWORD: ${MILVUS_IMPORT_PASSWORD:?required}
      MILVUS_QUERY_PASSWORD: ${MILVUS_QUERY_PASSWORD:?required}
      MILVUS_WORKER_PASSWORD: ${MILVUS_WORKER_PASSWORD:?required}
      MONGODB_BOOTSTRAP_URI: mongodb://${MONGO_ROOT_USER:-kb-root}:${MONGO_ROOT_PASSWORD:?required}@mongodb:27017/?authSource=admin&directConnection=true
      MONGO_IMPORT_PASSWORD: ${MONGO_IMPORT_PASSWORD:?required}
      MONGO_QUERY_PASSWORD: ${MONGO_QUERY_PASSWORD:?required}
      MONGO_WORKER_PASSWORD: ${MONGO_WORKER_PASSWORD:?required}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:?required}
      SEED_MAINTAINER_PASSWORD: ${SEED_MAINTAINER_PASSWORD:?required}
      SEED_REVIEWER_PASSWORD: ${SEED_REVIEWER_PASSWORD:?required}
      SEED_READER_PASSWORD: ${SEED_READER_PASSWORD:?required}
      SEED_OUTSIDER_PASSWORD: ${SEED_OUTSIDER_PASSWORD:?required}
  gateway:
    image: nginx:1.28.0-alpine
    restart: unless-stopped
    ports: ["${CPU_BIND_IP:-127.0.0.1}:8080:8080"]
    volumes: ["./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro"]
    depends_on: [kb-import, kb-query]
    networks: [knowledge]
networks:
  knowledge:
    driver: bridge
volumes:
  mongo-data:
  minio-data:
  etcd-data:
  milvus-data:
  neo4j-data:
  neo4j-logs:
secrets:
  mongo_key:
    file: ./secrets/mongo-key
