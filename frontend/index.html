<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>多领域知识工作台</title><link rel="stylesheet" href="/style.css"></head>
<body>
<header><div><span class="eyebrow">KNOWLEDGE WORKSPACE</span><h1>多领域知识工作台</h1></div><div id="identity">尚未登录</div><button id="logout" hidden>退出</button></header>
<main>
<section id="login-panel" class="card narrow"><h2>登录工作台</h2><p>使用管理员分配的账号。知识库范围由当前成员权限决定。</p><form id="login"><label>账号<input name="login" autocomplete="username" required></label><label>密码<input name="password" type="password" autocomplete="current-password" required></label><button>登录</button></form></section>
<div id="workspace" hidden>
<nav class="card"><label>当前知识库<select id="kb"></select></label><span id="role"></span><button id="refresh">刷新资料</button><span id="policy-summary"></span></nav>
<div class="columns">
<section class="card"><h2>资料与版本</h2><form id="upload"><label>资料文件<input name="file" type="file" accept=".md,.txt,.pdf,.docx" required></label><label>资料标题<input name="title" maxlength="200"></label><label class="inline"><input name="newVersion" type="checkbox">作为所选文档的新版本</label><button>上传并解析</button><p class="hint">MD/TXT 在 CPU 解析；PDF/DOCX 需知识库允许调用 MinerU API。单文件上限 20 MiB。</p></form><label>文档<select id="document"></select></label><label>版本<select id="version"></select></label><div id="version-status" class="hint"></div><div class="actions"><button id="preview">查看正文与定位</button><button id="submit">提交审核</button><button id="approve">审核通过</button><button id="reject">退回</button><button id="publish">发布</button><button id="rollback">回滚至此版本</button><button id="withdraw" class="secondary">下架</button><button id="delete" class="danger">删除文档</button></div><label>审核说明<input id="review-reason" maxlength="1000" placeholder="核对原文、来源与适用范围"></label><pre id="preview-content" class="preview">选择资料查看内容。</pre><div id="task-panel" hidden><h3>后台任务</h3><code id="task-id"></code><p id="task-status"></p><button id="task-check">查询状态</button><button id="task-retry">重试失败任务</button></div></section>
<section class="card"><h2>检索与问答</h2><form id="ask"><label>问题<textarea id="question" maxlength="2000" rows="3" required placeholder="例如：课程开课前可以申请退款吗？"></textarea></label><div class="actions"><button name="action" value="answer">生成回答</button><button name="action" value="search" class="secondary">仅检索</button><button type="button" id="cancel" class="secondary" disabled>取消生成</button><button type="button" id="new-chat" class="secondary">新建会话</button></div></form><div id="answer-status" class="hint">等待提问</div><div id="answer" class="answer" aria-live="polite"></div><div id="sources"></div><pre id="citation" class="preview" hidden></pre><div id="feedback-panel" hidden><h3>反馈</h3><form id="feedback"><select id="feedback-type"><option value="answer_error">回答错误</option><option value="missing">资料缺失</option><option value="citation_error">引用问题</option></select><label>说明<textarea id="feedback-note" maxlength="2000" rows="2"></textarea></label><button>提交反馈</button></form></div><h3>会话记录</h3><div id="history" class="history"></div></section>
</div>
<section id="admin-panel" class="card" hidden><h2>知识库设置</h2><form id="policy" class="settings"><label class="inline"><input id="parser-egress" type="checkbox">允许向 MinerU 外发原文件</label><label class="inline"><input id="llm-egress" type="checkbox">允许向模型厂商外发授权证据</label><button>保存策略</button></form><form id="member" class="settings"><label>用户 ID<input id="member-user" required></label><label>角色<select id="member-role"><option value="reader">只读</option><option value="maintainer">维护</option><option value="reviewer">审核</option><option value="admin">管理</option><option value="revoke">撤销成员</option></select></label><button>更新成员</button></form><form id="acl" class="settings"><label>文档允许读取的用户 ID（逗号分隔；留空表示知识库全体成员）<input id="acl-users"></label><button>更新所选文档权限</button></form></section>
</div>
<div id="notice" role="status"></div>
</main><footer>回答与引用取自当前授权资料；发布后内容更新会保留历史版本。</footer><script type="module" src="/app.js"></script>
</body></html>
